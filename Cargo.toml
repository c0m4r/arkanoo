[package]
name = "arkanoo"
version = "0.5.1"
edition = "2021"

[dependencies]
sdl2 = { version = "0.37", features = ["mixer", "ttf", "image"] }
rand = "0.8"
once_cell = "1.21.3"
webbrowser = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Link SDL2 and its add-ons statically (found via pkg-config). Used by the
# release build in packaging/, which provides self-contained static SDL libs.
static-sdl = ["sdl2/static-link", "sdl2/use-pkgconfig"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
